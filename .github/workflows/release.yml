name: Release and Publish

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: dockerhub
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      # - name: Build docker image
      #   run: |
      #     docker build \
      #       --build-arg CONVEX_DEPLOY_KEY="${{ secrets.CONVEX_TOKEN }}" \
      #       --build-arg PUBLIC_CONVEX_URL="${{ secrets.PUBLIC_CONVEX_URL }}" \
      #       --build-arg PUBLIC_CONVEX_SITE_URL="${{ secrets.PUBLIC_CONVEX_SITE_URL }}" \
      #       -t "${{ secrets.DOCKERHUB_USERNAME }}/tesla-live-share:latest" .

      - name: Install dependencies
        run: pnpm install

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_TOKEN }}
          PUBLIC_CONVEX_URL: ${{ secrets.PUBLIC_CONVEX_URL }}
          PUBLIC_CONVEX_SITE_URL: ${{ secrets.PUBLIC_CONVEX_SITE_URL }}
        run: pnpm semantic-release
